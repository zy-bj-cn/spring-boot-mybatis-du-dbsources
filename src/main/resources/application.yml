spring:
  main:
    banner-mode: "off"

app:
  datasource:
    db1:
      jdbc-url: jdbc:h2:mem:db1;DB_CLOSE_DELAY=-1;MODE=MySQL
      driver-class-name: org.h2.Driver
      username: sa
      password: ""
    db2:
      jdbc-url: jdbc:h2:mem:db2;DB_CLOSE_DELAY=-1;MODE=MySQL
      driver-class-name: org.h2.Driver
      username: sa
      password: ""
